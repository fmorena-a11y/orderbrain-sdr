name: Pruebas
on:
  push:
    branches: [main, app-sdr]
    paths-ignore: ["data/schools.json", "data/radar/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
